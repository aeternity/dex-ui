name: Staging Dex UI Pipeline

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

env:
  PR_NUMBER: ${{ github.event.pull_request.number }}
  ENV: 'stg'
  APP: 'dex-ui'
  DOMAIN: 'service.aepps.com'

jobs:
  main:
    runs-on: ubuntu-latest
    name: Web build docker
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Cache Docker layers
        uses: actions/cache@v6
        with:
          path: /tmp/.buildx-cache
          # Key is named differently to avoid collision
          key: ${{ runner.os }}-${{ env.ENV }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ env.ENV }}-buildx

      - name: Log in to dockerhub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_PASS }}

      - name: Extract metadata for docker
        if: github.event_name == 'pull_request' && github.event.action == 'opened' || github.event.action == 'synchronize'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: aeternity/dex-ui
          tags: |
            type=raw,value=latest,enable=${{ endsWith(GitHub.ref, 'main') }}
            type=ref,event=tag
            type=ref,event=pr

      - name: Get commit sha on PR Sync
        if: github.event_name == 'pull_request' && github.event.action == 'synchronize'
        id: git-sha
        shell: bash
        run: |
          echo GIT_SHA=$(git rev-parse --short HEAD) >> $GITHUB_OUTPUT

      - name: Build and push docker image
        if: github.event_name == 'pull_request' && github.event.action == 'opened' || github.event.action == 'synchronize'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          build-args: |
            VUE_APP_MAINNET_DEX_BACKEND_URL="https://dex-backend-mainnet.prd.service.aepps.com" 
            VUE_APP_TESTNET_DEX_BACKEND_URL="https://dex-backend-testnet.prd.service.aepps.com"
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=local,src=/tmp/.buildx-cache
          # Note the mode=max here
          # More: https://github.com/moby/buildkit#--export-cache-options
          # And: https://github.com/docker/buildx#--cache-tonametypetypekeyvalue
          cache-to: type=local,mode=max,dest=/tmp/.buildx-cache-new

      - name: Move cache
        if: github.event_name == 'pull_request' && github.event.action == 'opened' || github.event.action == 'synchronize'
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - uses: actions/checkout@v7
        with:
          repository: aeternity/gitops-apps-aelabs
          token: ${{ secrets.BOT_GITHUB_TOKEN }}
          ref: stg
          persist-credentials: false
          fetch-depth: 0

      - name: Chekc the initial PR deployment status before make a PR Sync.
        continue-on-error: true
        if: github.event_name == 'pull_request' || github.event.action != 'synchronize' || github.event.action == 'opened' || github.event.action == 'reopened'
        uses: aeternity/ae-github-actions/deploy-status@v7
        with:
          url: https://pr-${{ env.PR_NUMBER }}-${{ env.APP }}.${{ env.ENV }}.${{ env.DOMAIN }}
          timeout: 10

      - name: Staging PR Sync
        if: github.event_name == 'pull_request' && github.event.action == 'synchronize'
        uses: aeternity/ae-github-actions/argocd-pr-sync@v7
        with:
          git-sha: ${{ steps.git-sha.outputs.GIT_SHA }}
          url-prefix: pr-${{ env.PR_NUMBER }}
          env: ${{ env.ENV }}
          app: ${{ env.APP }}
          domain: ${{ env.DOMAIN }}

      - name: Staging deploy
        if: github.event_name == 'pull_request' && github.event.action == 'opened' || github.event.action == 'reopened'
        uses: aeternity/ae-github-actions/argocd-deploy@v7
        with:
          url-prefix: pr-${{ env.PR_NUMBER }}
          env: ${{ env.ENV }}
          app: ${{ env.APP }}
          domain: ${{ env.DOMAIN }}

      - name: Staging undeploy
        if: ((github.event_name == 'pull_request' && github.event.action == 'closed' && startsWith(github.head_ref, 'release') != true) || (github.event_name == 'delete' && github.event.ref_type == 'branch'))
        uses: aeternity/ae-github-actions/argocd-undeploy@v7
        with:
          url-prefix: pr-${{ env.PR_NUMBER }}
          env: ${{ env.ENV }}
          app: ${{ env.APP }}
          domain: ${{ env.DOMAIN }}

      - name: Comment PR with deployment URL
        uses: peter-evans/create-or-update-comment@v5
        if: github.event_name == 'pull_request' && github.event.action == 'opened'
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            🚀 Deployed to https://pr-${{ env.PR_NUMBER }}-${{ env.APP }}.${{ env.ENV }}.${{ env.DOMAIN }}
          token: ${{ secrets.GITHUB_TOKEN }}
          edit-mode: replace

      - name: Push changes
        uses: ad-m/github-push-action@v1
        with:
          repository: aeternity/gitops-apps-aelabs
          github_token: ${{ secrets.BOT_GITHUB_TOKEN }}
          branch: stg
